<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>西藏旅行路线 · A线 & B线</title>
<style>
:root{--bg-primary:#F5F5F7;--bg-surface:#FFFFFF;--bg-glass:rgba(255,255,255,0.75);--text-primary:#1D1D1F;--text-secondary:#86868B;--color-primary:#0066CC;--color-gold:#D4AF37;--radius:20px;--shadow:0 4px 30px rgba(0,0,0,0.08);--route-a:#0066CC;--route-b:#D4AF37}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Arial,sans-serif;background:var(--bg-primary);color:var(--text-primary);-webkit-font-smoothing:antialiased;overflow-x:hidden}
.nav{position:fixed;top:0;left:0;right:0;z-index:1000;background:var(--bg-glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid rgba(0,0,0,0.08);padding:0 16px;height:56px;display:flex;align-items:center;gap:10px}
.nav-brand{font-size:16px;font-weight:700;color:var(--text-primary);white-space:nowrap;display:flex;align-items:center;gap:6px;flex-shrink:0}
.nav-brand svg{width:22px;height:22px}
.route-tabs{display:flex;gap:8px;margin-left:auto;flex-shrink:0}
.route-tab{padding:6px 18px;border-radius:20px;border:none;font-size:14px;font-weight:600;cursor:pointer;transition:all .25s ease}
.route-tab.tab-a{background:rgba(0,102,204,0.1);color:var(--route-a)}
.route-tab.tab-a.active{background:var(--route-a);color:#fff;box-shadow:0 2px 12px rgba(0,102,204,0.3)}
.route-tab.tab-b{background:rgba(212,175,55,0.1);color:var(--route-b)}
.route-tab.tab-b.active{background:var(--route-b);color:#fff;box-shadow:0 2px 12px rgba(212,175,55,0.3)}
#map{width:100%;height:50vh;margin-top:56px;position:relative;z-index:1}
.content{max-width:900px;margin:0 auto;padding:24px 16px 80px}
.route-banner{background:var(--bg-surface);border-radius:var(--radius);padding:28px;box-shadow:var(--shadow);margin-bottom:24px}
.route-banner .tag{display:inline-block;padding:4px 14px;border-radius:12px;font-size:13px;font-weight:700;margin-bottom:10px;color:#fff}
.route-banner .tag-a{background:var(--route-a)}
.route-banner .tag-b{background:var(--route-b)}
.route-banner h1{font-size:26px;font-weight:700;line-height:1.3;margin-bottom:6px}
.route-banner .sub{color:var(--text-secondary);font-size:14px;line-height:1.5;margin-bottom:16px}
.stats{display:flex;gap:12px;flex-wrap:wrap}
.stat{background:var(--bg-primary);border-radius:14px;padding:14px 16px;flex:1;min-width:120px}
.stat-label{font-size:11px;color:var(--text-secondary);margin-bottom:2px}
.stat-value{font-size:18px;font-weight:700}
.section-title{font-size:20px;font-weight:700;margin:32px 0 16px;display:flex;align-items:center;gap:8px}
.day-card{display:flex;gap:14px;margin-bottom:14px}
.day-marker{width:52px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;padding-top:18px}
.day-num{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;position:relative;z-index:2;box-shadow:0 2px 8px rgba(0,0,0,0.15)}
.day-line{width:2px;flex:1;margin-top:4px;opacity:0.15;border-radius:1px}
.day-body{flex:1;background:var(--bg-surface);border-radius:16px;padding:16px 18px;box-shadow:0 2px 12px rgba(0,0,0,0.04);transition:all .2s;cursor:pointer;border:1.5px solid transparent;position:relative}
.day-body:hover{box-shadow:0 4px 20px rgba(0,0,0,0.1);transform:translateY(-1px)}
.day-body.highlighted{border-color:currentColor}
.stops-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
.stop-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.stop-name{font-size:14px;font-weight:700;color:var(--text-primary);white-space:nowrap}
.stop-desc{font-size:11px;color:var(--text-secondary);white-space:nowrap;margin-left:-2px}
.stop-arrow{color:var(--text-secondary);font-size:12px;opacity:0.4;flex-shrink:0}
.meta-row{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:8px}
.meta{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--text-secondary)}
.meta .val{font-weight:600;color:var(--text-primary)}
.nav-link{display:inline-block;margin-top:6px;padding:4px 12px;border-radius:14px;background:rgba(0,102,204,0.1);color:var(--color-primary);font-size:12px;font-weight:600;text-decoration:none;transition:all .2s}
.nav-link:hover{background:var(--color-primary);color:#fff}
.detail-toggle{display:inline-block;margin-left:8px;font-size:12px;color:var(--color-primary);font-weight:600;cursor:pointer;border:none;background:none;padding:4px 0}
.detail-panel{display:none;margin-top:12px;border-top:1px solid rgba(0,0,0,0.06);padding-top:12px}
.detail-panel.open{display:block;animation:fadeIn .3s ease}
.detail-item{margin-bottom:10px}
.detail-item:last-child{margin-bottom:0}
.detail-item-title{font-size:12px;font-weight:700;color:var(--text-primary);margin-bottom:4px;display:flex;align-items:center;gap:4px}
.detail-item-text{font-size:12px;color:var(--text-secondary);line-height:1.6}
.detail-item-text .price{color:#E63946;font-weight:600}
.footer{text-align:center;padding:40px 16px;color:var(--text-secondary);font-size:13px;line-height:1.8}
@media(max-width:768px){
.nav{height:50px;padding:0 10px;gap:6px}
.nav-brand{font-size:14px}
#map{height:40vh;margin-top:50px}
.route-banner{padding:20px}
.route-banner h1{font-size:20px}
.stats{gap:8px}
.stat{padding:10px 12px;min-width:90px}
.stat-value{font-size:15px}
.day-marker{width:44px}
.day-num{width:32px;height:32px;font-size:11px}
.day-body{padding:12px 14px}
.content{padding:16px 12px 60px}
}
.fade-in{animation:fadeIn .4s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<nav class="nav">
<div class="nav-brand">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
西藏路线
</div>
<div class="route-tabs">
<button class="route-tab tab-a active" onclick="switchRoute('A')">A线</button>
<button class="route-tab tab-b" onclick="switchRoute('B')">B线</button>
</div>
</nav>
<div id="map"></div>
<div class="content" id="content"></div>
<div class="footer">地图：© 高德地图<br>数据更新于 2026年8月</div>
<script src="https://webapi.amap.com/maps?v=2.0&key=c69b99057ab90a4de0033f856492385c"></script>
<script>
const ROUTES={
A:{
name:'林芝·新措·羊湖·纳木错',tag:'A线',color:'#0066CC',
days:5,totalKm:1860,totalH:26,
days_data:[
{d:'D1',dist:'350km',time:'4h',alt:'2700m',
stops:[
{n:'拉萨',lat:29.65,lon:91.11},
{n:'巴松措',lat:30.00,lon:93.91,desc:'人间绿宝石'},
{n:'新措',lat:30.02,lon:93.96,desc:'开最颠簸的路，走最平顺的徒步'},
{n:'结巴村',lat:30.01,lon:93.88}
]},
{d:'D2',dist:'250km',time:'4h',alt:'2700m',
stops:[
{n:'结巴村',lat:30.01,lon:93.88},
{n:'色季拉山口',lat:29.73,lon:94.07,desc:'日照金山绝佳机位'},
{n:'鲁朗林海',lat:29.78,lon:94.72,desc:'天然牧场'},
{n:'雅鲁藏布江大峡谷',lat:29.62,lon:94.93,desc:'人类最后的秘境'},
{n:'索松村',lat:29.97,lon:94.85}
]},
{d:'D3',dist:'480km',time:'6h',alt:'3200m',
stops:[
{n:'索松村',lat:29.97,lon:94.85,desc:'观南迦巴瓦峰日出'},
{n:'佛掌沙丘',lat:29.50,lon:94.50,desc:'雪山与沙漠融合'},
{n:'尼洋河风光',lat:29.50,lon:93.80},
{n:'拉萨',lat:29.65,lon:91.11}
]},
{d:'D4',dist:'350km',time:'6h',alt:'3200m',
stops:[
{n:'拉萨',lat:29.65,lon:91.11},
{n:'羊卓雍措',lat:28.93,lon:90.67,desc:'西藏三大圣湖之一'},
{n:'卡若拉冰川',lat:28.78,lon:90.25,desc:'西藏三大大陆型冰川之一'},
{n:'拉萨',lat:29.65,lon:91.11}
]},
{d:'D5',dist:'430km',time:'6h',alt:'3200m',
stops:[
{n:'拉萨',lat:29.65,lon:91.11},
{n:'纳木错扎西半岛',lat:30.70,lon:90.50,desc:'距离天堂最近的湖泊'},
{n:'念青唐古拉山',lat:30.47,lon:90.70,desc:'远看是山，近看是川'},
{n:'拉萨',lat:29.65,lon:91.11}
]}
]},
B:{
name:'林芝·羊湖·藏北草原·纳木错',tag:'B线',color:'#D4AF37',
days:5,totalKm:2060,totalH:29,
days_data:[
{d:'D1',dist:'480km',time:'6h',alt:'2700m',
stops:[
{n:'拉萨',lat:29.65,lon:91.11},
{n:'巴松措',lat:30.00,lon:93.91,desc:'人间绿宝石'},
{n:'雅鲁藏布江大峡谷',lat:29.62,lon:94.93,desc:'人类最后的秘境'},
{n:'索松村',lat:29.97,lon:94.85}
]},
{d:'D2',dist:'480km',time:'6h',alt:'2700m',
stops:[
{n:'索松村',lat:29.97,lon:94.85,desc:'观南迦巴瓦峰日出'},
{n:'佛掌沙丘',lat:29.50,lon:94.50,desc:'雪山与沙漠融合'},
{n:'尼洋河风光',lat:29.50,lon:93.80},
{n:'拉萨',lat:29.65,lon:91.11}
]},
{d:'D3',dist:'280km',time:'4h',alt:'3800m',
stops:[
{n:'拉萨',lat:29.65,lon:91.11},
{n:'羊卓雍措',lat:28.93,lon:90.67,desc:'西藏三大圣湖之一'},
{n:'卡若拉冰川',lat:28.78,lon:90.25,desc:'西藏三大大陆型冰川之一'},
{n:'满拉水库',lat:28.92,lon:88.90},
{n:'日喀则',lat:29.27,lon:88.88}
]},
{d:'D4',dist:'500km',time:'7h',alt:'4200m',
stops:[
{n:'日喀则',lat:29.27,lon:88.88},
{n:'远观杰岗日神山',lat:30.20,lon:89.30,desc:'公路旅行大片'},
{n:'藏北草原',lat:31.50,lon:90.00,desc:'邂逅各种野生动物'},
{n:'色林错',lat:31.10,lon:88.60,desc:'西藏最大的湖泊'},
{n:'班戈',lat:31.37,lon:90.01}
]},
{d:'D5',dist:'400km',time:'6h',alt:'3200m',
stops:[
{n:'班戈',lat:31.37,lon:90.01},
{n:'巴木错',lat:30.80,lon:90.50,desc:'勇士湖&姐妹湖'},
{n:'三生石&圣象天门',lat:30.85,lon:90.85,desc:'永远的天湖，许下爱的诺言'},
{n:'念青唐古拉山',lat:30.47,lon:90.70,desc:'远看是山，近看是川'},
{n:'拉萨',lat:29.65,lon:91.11}
]}
]
}
};

let map,currentRoute='A',infoWindow=null,markers=[],polyline=null;

function initMap(){
map=new AMap.Map("map",{zoom:5,center:[91,30.5],viewMode:"2D",resizeEnable:true});
infoWindow=new AMap.InfoWindow({offset:new AMap.Pixel(0,-30),closeWhenClickMap:true});
renderRoute('A');
}

function switchRoute(id){
currentRoute=id;
document.querySelectorAll('.route-tab').forEach(t=>{t.classList.remove('active');});
document.querySelector('.tab-'+id.toLowerCase()).classList.add('active');
renderRoute(id);
window.scrollTo({top:document.getElementById('map').offsetTop+document.getElementById('map').offsetHeight-56,behavior:'smooth'});
}

function renderRoute(id){
const R=ROUTES[id];
markers.forEach(m=>map.remove(m));markers=[];
if(polyline){map.remove(polyline);polyline=null;}

// Collect unique stops for map markers
const coords=[];const seen={};
R.days_data.forEach(day=>{
day.stops.forEach(s=>{
const key=s.n+s.lat;
if(seen[key])return;seen[key]=1;
const pos=[s.lon,s.lat];coords.push(pos);
const marker=new AMap.Marker({position:pos,
content:`<div style="width:14px;height:14px;border-radius:50%;background:${R.color};border:2.5px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,0.3);"></div>`,
offset:new AMap.Pixel(-7,-7),extData:s});
marker.on("click",function(){
const amapUrl=`https://uri.amap.com/marker?position=${s.lon},${s.lat}&name=${encodeURIComponent(s.n)}&coordinate=gaode&callnative=1`;
infoWindow.setContent(`<div style="padding:10px 14px;min-width:160px"><div style="font-weight:700;font-size:15px">${s.n}</div>${s.desc?`<div style="color:#86868B;font-size:12px;margin:4px 0 8px">${s.desc}</div>`:''}<a href="${amapUrl}" target="_blank" style="display:inline-block;padding:4px 12px;border-radius:14px;background:${R.color};color:#fff;font-size:12px;font-weight:600;text-decoration:none"> 导航到此</a></div>`);
infoWindow.open(map,pos);
});
map.add(marker);markers.push(marker);
});
});

// Draw polylines for each day
R.days_data.forEach(day=>{
const dayCoords=day.stops.map(s=>[s.lon,s.lat]);
if(dayCoords.length>1){
const pl=new AMap.Polyline({path:dayCoords,strokeColor:R.color,strokeWeight:4,strokeOpacity:0.6,lineJoin:"round",lineCap:"round",showDir:true});
map.add(pl);polyline=pl;
}
});
map.setFitView(null,false,[60,60,60,60],9);

// Render content
renderContent(R);
}

function renderContent(R){
const c=document.getElementById('content');
const tagClass=R.color==='#0066CC'?'tag-a':'tag-b';
let h=`<div class="route-banner fade-in">
<span class="tag ${tagClass}">${R.tag}</span>
<h1>${R.name}</h1>
<p class="sub">${R.days}天环游西藏，涵盖林芝、圣湖、冰川、草原</p>
<div class="stats">
<div class="stat"><div class="stat-label">行程天数</div><div class="stat-value">${R.days}天</div></div>
<div class="stat"><div class="stat-label">总里程</div><div class="stat-value">${R.totalKm}km</div></div>
<div class="stat"><div class="stat-label">总车程</div><div class="stat-value">${R.totalH}h</div></div>
</div></div>`;

h+=`<div class="section-title">📋 每日行程</div>`;
R.days_data.forEach((day,di)=>{
const firstStop=day.stops[0];
const navUrl=`https://uri.amap.com/marker?position=${firstStop.lon},${firstStop.lat}&name=${encodeURIComponent(firstStop.n)}&coordinate=gaode&callnative=1`;

h+=`<div class="day-card">`;
h+=`<div class="day-marker"><div class="day-num" style="background:${R.color}">${day.d}</div><div class="day-line" style="background:${R.color}"></div></div>`;
h+=`<div class="day-body" style="color:${R.color}" onclick="highlightDay(this,${di})">`;

// Stops row
h+=`<div class="stops-row">`;
day.stops.forEach((s,si)=>{
if(si>0) h+=`<span class="stop-arrow">→</span>`;
h+=`<span class="stop-dot" style="background:${R.color}"></span>`;
h+=`<span class="stop-name">${s.n}</span>`;
if(s.desc) h+=`<span class="stop-desc">${s.desc}</span>`;
});
h+=`</div>`;

// Meta row
h+=`<div class="meta-row">`;
h+=`<div class="meta">📏 车程 <span class="val">${day.dist}</span></div>`;
h+=`<div class="meta">⏱ 时长 <span class="val">${day.time}</span></div>`;
h+=`<div class="meta">🏔 海拔 <span class="val">${day.alt}</span></div>`;
h+=`</div>`;

h+=`<a href="${navUrl}" target="_blank" class="nav-link">📍 导航到起点</a>`;
h+=`<button class="detail-toggle" onclick="event.stopPropagation();toggleDetail(this)">📖 攻略 ▾</button>`;

// Detail panel
h+=`<div class="detail-panel">`;
day.stops.forEach(s=>{
h+=`<div class="detail-item"><div class="detail-item-title">📍 ${s.n}</div>`;
if(s.desc) h+=`<div class="detail-item-text">${s.desc}</div>`;
h+=`</div>`;
});
h+=`</div>`;

h+=`</div></div>`;
});

c.innerHTML=h;
}

function toggleDetail(btn){
const panel=btn.nextElementSibling;
const isOpen=panel.classList.contains('open');
document.querySelectorAll('.detail-panel.open').forEach(p=>{p.classList.remove('open');});
if(!isOpen){panel.classList.add('open');btn.textContent='📖 收起 ▴';}
}

function highlightDay(el,idx){
document.querySelectorAll('.day-body').forEach(c=>c.classList.remove('highlighted'));
el.classList.add('highlighted');
const R=ROUTES[currentRoute];
const day=R.days_data[idx];
if(day&&day.stops.length){
const mid=Math.floor(day.stops.length/2);
const s=day.stops[mid];
map.setCenter([s.lon,s.lat]);
map.setZoom(8);
}
}

initMap();
</script>
</body>
</html>
