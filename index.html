<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>西藏经典路线 · 林芝羊湖珠峰纳木错</title>
<style>
:root{--bg-primary:#F5F5F7;--bg-surface:#FFFFFF;--bg-glass:rgba(255,255,255,0.75);--text-primary:#1D1D1F;--text-secondary:#86868B;--color-primary:#0066CC;--color-gold:#D4AF37;--radius:20px;--shadow:0 4px 30px rgba(0,0,0,0.08)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Arial,sans-serif;background:var(--bg-primary);color:var(--text-primary);-webkit-font-smoothing:antialiased;overflow-x:hidden}
.nav{position:fixed;top:0;left:0;right:0;z-index:1000;background:var(--bg-glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid rgba(0,0,0,0.08);padding:0 16px;height:56px;display:flex;align-items:center;gap:8px}
.nav-brand{font-size:16px;font-weight:700;color:var(--text-primary);white-space:nowrap;display:flex;align-items:center;gap:6px}
.nav-brand svg{width:22px;height:22px}
#map{width:100%;height:55vh;margin-top:56px;border-radius:0;position:relative;z-index:1}
.content{max-width:900px;margin:0 auto;padding:24px 16px 80px}
.route-header{background:var(--bg-surface);border-radius:var(--radius);padding:28px;box-shadow:var(--shadow);margin-bottom:24px}
.route-tag{display:inline-block;padding:4px 12px;border-radius:12px;font-size:12px;font-weight:600;margin-bottom:12px;background:rgba(0,102,204,0.1);color:var(--color-primary)}
.route-title{font-size:28px;font-weight:700;margin-bottom:8px;line-height:1.3}
.route-sub{color:var(--text-secondary);font-size:15px;line-height:1.6;margin-bottom:20px}
.tip-box{background:rgba(0,102,204,0.05);border-radius:14px;padding:16px 18px;margin-bottom:20px;display:flex;gap:10px;align-items:flex-start}
.tip-box .icon{font-size:20px;flex-shrink:0}
.tip-box .text{font-size:14px;color:var(--text-primary);line-height:1.6}
.info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.info-item{background:var(--bg-primary);border-radius:14px;padding:16px;display:flex;align-items:flex-start;gap:12px}
.info-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.info-icon.cal{background:rgba(0,102,204,0.1)}
.info-icon.car{background:rgba(42,157,141,0.1)}
.info-icon.star{background:rgba(212,175,55,0.1)}
.info-icon.warn{background:rgba(230,57,70,0.1)}
.info-label{font-size:12px;color:var(--text-secondary);margin-bottom:2px}
.info-value{font-size:14px;font-weight:600;color:var(--text-primary)}
.timeline{margin-top:24px}
.timeline-title{font-size:20px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.day-card{display:flex;gap:16px;margin-bottom:2px}
.day-marker{width:60px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;padding-top:20px}
.day-num{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;position:relative;z-index:2}
.day-line{width:2px;flex:1;margin-top:4px;opacity:0.2}
.day-card-body{flex:1;background:var(--bg-surface);border-radius:16px;padding:18px 20px;margin-bottom:10px;box-shadow:0 2px 12px rgba(0,0,0,0.04);transition:all .2s ease;cursor:pointer;border:1.5px solid transparent}
.day-card-body:hover{box-shadow:0 4px 20px rgba(0,0,0,0.1);transform:translateY(-1px);border-color:rgba(0,102,204,0.2)}
.day-card-body.highlighted{border-color:var(--color-primary);box-shadow:0 4px 20px rgba(0,102,204,0.15)}
.day-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.day-label{font-size:13px;font-weight:700;color:var(--color-primary)}
.day-dist{font-size:12px;color:var(--text-secondary);background:var(--bg-primary);padding:2px 8px;border-radius:8px}
.day-route{font-size:15px;font-weight:600;color:var(--text-primary);margin-bottom:4px;line-height:1.4}
.day-note{font-size:13px;color:var(--text-secondary);line-height:1.5}
.footer{text-align:center;padding:40px 16px;color:var(--text-secondary);font-size:13px;line-height:1.8}
@media(max-width:768px){
.nav{height:50px;padding:0 10px}
.nav-brand{font-size:14px}
#map{height:42vh;margin-top:50px}
.route-title{font-size:22px}
.route-header{padding:20px}
.info-grid{grid-template-columns:1fr 1fr}
.day-marker{width:48px}
.day-num{width:34px;height:34px;font-size:11px}
.content{padding:16px 12px 60px}
}
@media(max-width:480px){
.info-grid{grid-template-columns:1fr}
}
.fade-in{animation:fadeIn .4s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<nav class="nav">
<div class="nav-brand">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
西藏路线
</div>
</nav>
<div id="map"></div>
<div class="content" id="content"></div>
<div class="footer">地图：© 高德地图</div>
<script src="https://webapi.amap.com/maps?v=2.0&key=c69b99057ab90a4de0033f856492385c"></script>
<script>
const ROUTE={
name:"林芝·羊湖·珠峰·纳木错",
sub:"经典8日游（同事推荐版）",
warning:"注意高反，Day1勿剧烈运动",
days:8,transport:"包车/拼车",crowd:"首次进藏",color:"#0066CC",
stops:[
{n:"林芝",lat:29.65,lon:94.36,d:"D1",desc:"深圳飞林芝，看日落金山"},
{n:"索松村",lat:29.97,lon:94.85,d:"D1",desc:"南迦巴瓦峰日落+星空"},
{n:"拉萨",lat:29.65,lon:91.1,d:"D2",desc:"林芝→拉萨"},
{n:"拉萨",lat:29.65,lon:91.12,d:"D2-3",desc:"布达拉宫、大昭寺、八廓街"},
{n:"羊卓雍措",lat:28.93,lon:90.67,d:"D4",desc:"拉萨→羊湖→卡若拉冰川→日喀则"},
{n:"卡若拉冰川",lat:28.78,lon:90.25,d:"D4",desc:"途经冰川"},
{n:"日喀则",lat:29.27,lon:88.88,d:"D4",desc:"住日喀则"},
{n:"定日",lat:28.66,lon:87.12,d:"D5",desc:"日喀则→定日→珠峰大本营"},
{n:"珠峰大本营",lat:28.14,lon:86.85,d:"D5-6",desc:"珠峰脚下观日出"},
{n:"日喀则",lat:29.27,lon:88.88,d:"D7",desc:"珠峰→日喀则（扎什伦布寺）→拉萨"},
{n:"纳木错",lat:30.7,lon:90.5,d:"D8",desc:"拉萨→纳木错→拉萨"}
],
schedule:[
{d:"D1",route:"深圳→林芝·索松村（南迦巴瓦峰）",dist:"",note:"飞林芝米林机场，直奔索松村看南迦巴瓦日落金山+星空，海拔约3000m"},
{d:"D2",route:"林芝→拉萨",dist:"约400km",note:"沿途尼洋河风光，抵达拉萨适应海拔"},
{d:"D2-3",route:"拉萨市区深度游",dist:"",note:"布达拉宫、大昭寺、八廓街、色拉寺辩经"},
{d:"D4",route:"拉萨→羊卓雍措→卡若拉冰川→日喀则",dist:"约360km",note:"羊湖海拔4441m，三大圣湖之一；途经卡若拉冰川"},
{d:"D5",route:"日喀则→定日→珠峰大本营",dist:"约350km",note:"海拔5200m，抵达珠峰脚下，注意保暖防风"},
{d:"D6",route:"珠峰大本营（观日出）→日喀则",dist:"约350km",note:"清晨观赏珠峰日照金山，下午返回日喀则"},
{d:"D7",route:"日喀则·扎什伦布寺→拉萨",dist:"约280km",note:"参观历代班禅驻锡地，下午返回拉萨"},
{d:"D8",route:"拉萨→纳木错→拉萨",dist:"约440km",note:"纳木错海拔4718m，三大圣湖之一，日落/星空"}
]
};

let map,infoWindow=null,markers=[],polyline=null;
function initMap(){
map=new AMap.Map("map",{zoom:5,center:[91,30.5],viewMode:"2D",resizeEnable:true});
infoWindow=new AMap.InfoWindow({offset:new AMap.Pixel(0,-30),closeWhenClickMap:true});
renderMap();renderContent();
}
function renderMap(){
markers.forEach(m=>map.remove(m));markers=[];
if(polyline){map.remove(polyline);polyline=null;}
const coords=[];const seen={};
ROUTE.stops.forEach(s=>{
const key=s.n+s.d;
if(seen[key])return;seen[key]=1;
const pos=[s.lon,s.lat];coords.push(pos);
const marker=new AMap.Marker({position:pos,content:`<div style="width:14px;height:14px;border-radius:50%;background:${ROUTE.color};border:2.5px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,0.3);"></div>`,offset:new AMap.Pixel(-7,-7),extData:s});
marker.on("click",function(){
infoWindow.setContent(`<div style="padding:8px 12px"><div style="font-weight:700;font-size:15px">${s.n}</div><div style="color:#0066CC;font-size:13px;font-weight:500">${s.d}${s.desc?' · '+s.desc:''}</div></div>`);
infoWindow.open(map,pos);
});
map.add(marker);markers.push(marker);
});
if(coords.length>1){
polyline=new AMap.Polyline({path:coords,strokeColor:ROUTE.color,strokeWeight:4,strokeOpacity:0.75,lineJoin:"round",lineCap:"round"});
map.add(polyline);
}
map.setFitView(null,false,[60,60,60,60],9);
}
function renderContent(){
const c=document.getElementById("content");
let h=`<div class="route-header fade-in">
<span class="route-tag">定制路线</span>
<h1 class="route-title">${ROUTE.name} <span style="color:var(--text-secondary);font-weight:400;font-size:20px">${ROUTE.sub}</span></h1>
<div class="tip-box"><span class="icon">💡</span><span class="text">同事推荐路线：先去林芝看日落金山和星空，再去羊湖，不高的情况下日喀则→珠峰脚下，最好再去纳木错。</span></div>
<div class="info-grid">
<div class="info-item"><div class="info-icon cal">📅</div><div><div class="info-label">建议天数</div><div class="info-value">${ROUTE.days}天</div></div></div>
<div class="info-item"><div class="info-icon car">🚗</div><div><div class="info-label">交通方式</div><div class="info-value">${ROUTE.transport}</div></div></div>
<div class="info-item"><div class="info-icon star">⭐</div><div><div class="info-label">适合人群</div><div class="info-value">${ROUTE.crowd}</div></div></div>
<div class="info-item"><div class="info-icon warn">⚠️</div><div><div class="info-label">注意事项</div><div class="info-value" style="font-weight:400;font-size:13px">${ROUTE.warning}</div></div></div>
</div></div>`;
h+='<div class="timeline fade-in"><div class="timeline-title">📋 每日行程</div>';
ROUTE.schedule.forEach((s,i)=>{
h+=`<div class="day-card"><div class="day-marker"><div class="day-num" style="background:${ROUTE.color}">${s.d}</div><div class="day-line" style="background:${ROUTE.color}"></div></div><div class="day-card-body" onclick="highlightStop(this,${i})" data-idx="${i}"><div class="day-head"><span class="day-label">${s.d}</span>${s.dist?`<span class="day-dist">${s.dist}</span>`:''}</div><div class="day-route">${s.route}</div><div class="day-note">${s.note}</div></div></div>`;
});
h+='</div>';
c.innerHTML=h;
}
function highlightStop(el,idx){
document.querySelectorAll(".day-card-body").forEach(c=>c.classList.remove("highlighted"));
el.classList.add("highlighted");
let si=0;const seen2={};
for(let i=0;i<ROUTE.stops.length;i++){
const s=ROUTE.stops[i];const key=s.n+s.d;
if(seen2[key])continue;seen2[key]=1;
if(si===idx){map.setCenter([s.lon,s.lat]);map.setZoom(Math.max(map.getZoom(),9));break;}
si++;
}
}
initMap();
</script>
</body>
</html>
