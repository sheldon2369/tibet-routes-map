:root{--bg-primary:#F5F5F7;--bg-surface:#FFFFFF;--bg-glass:rgba(255,255,255,0.75);--text-primary:#1D1D1F;--text-secondary:#86868B;--color-primary:#0066CC;--color-gold:#D4AF37;--color-red:#E63946;--color-teal:#2A9D8F;--radius:20px;--shadow:0 4px 30px rgba(0,0,0,0.08)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Arial,sans-serif;background:var(--bg-primary);color:var(--text-primary);-webkit-font-smoothing:antialiased;overflow-x:hidden}

.nav-brand svg{width:22px;height:22px}
.nav-scroll{display:flex;gap:6px;overflow-x:auto;flex:1;scrollbar-width:none;-ms-overflow-style:none;padding:4px 0}
.nav-scroll::-webkit-scrollbar{display:none}
.nav-btn{padding:6px 14px;border-radius:20px;border:none;background:transparent;color:var(--text-secondary);font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;transition:all .25s ease;flex-shrink:0}
.nav-btn:hover{background:rgba(0,102,204,0.08);color:var(--color-primary)}
.nav-btn.active{background:var(--color-primary);color:#fff;box-shadow:0 2px 12px rgba(0,102,204,0.3)}
.category-label{font-size:11px;font-weight:600;color:var(--text-secondary);text-transform:uppercase;letter-spacing:1px;padding:6px 10px;white-space:nowrap;flex-shrink:0;display:flex;align-items:center}
.category-divider{width:1px;height:20px;background:rgba(0,0,0,0.1);flex-shrink:0;margin:0 4px}
#map{width:100%;height:60vh;margin-top:56px;border-radius:0;position:relative;z-index:1}
.amap-info-contentContainer{border-radius:14px!important;box-shadow:0 4px 20px rgba(0,0,0,0.12)!important;font-family:inherit!important;padding:0!important}
.popup-title{font-weight:700;font-size:15px;color:var(--text-primary);margin-bottom:4px}
.popup-day{color:var(--color-primary);font-size:13px;font-weight:500}
.content{max-width:900px;margin:0 auto;padding:24px 16px 80px}
.route-header{background:var(--bg-surface);border-radius:var(--radius);padding:28px;box-shadow:var(--shadow);margin-bottom:24px}

.tag-overland{background:rgba(42,157,141,0.1);color:var(--color-teal)}
.route-title{font-size:28px;font-weight:700;margin-bottom:8px;line-height:1.3}
.route-desc{color:var(--text-secondary);font-size:15px;line-height:1.6;margin-bottom:20px}
.info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.info-item{background:var(--bg-primary);border-radius:14px;padding:16px;display:flex;align-items:flex-start;gap:12px}
.info-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.info-icon.cal{background:rgba(0,102,204,0.1)}
.info-icon.car{background:rgba(42,157,141,0.1)}
.info-icon.star{background:rgba(212,175,55,0.1)}
.info-icon.warn{background:rgba(230,57,70,0.1)}
.info-label{font-size:12px;color:var(--text-secondary);margin-bottom:2px}
.info-value{font-size:14px;font-weight:600;color:var(--text-primary)}
.timeline{margin-top:24px}
.timeline-title{font-size:20px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.day-card{display:flex;gap:16px;margin-bottom:2px;position:relative}
.day-marker{width:60px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;padding-top:20px}
.day-num{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;position:relative;z-index:2}
.day-line{width:2px;flex:1;margin-top:4px;opacity:0.2}
.day-card-body{flex:1;background:var(--bg-surface);border-radius:16px;padding:18px 20px;margin-bottom:10px;box-shadow:0 2px 12px rgba(0,0,0,0.04);transition:all .2s ease;cursor:pointer;border:1.5px solid transparent}
.day-card-body:hover{box-shadow:0 4px 20px rgba(0,0,0,0.1);transform:translateY(-1px);border-color:rgba(0,102,204,0.2)}
.day-card-body.highlighted{border-color:var(--color-primary);box-shadow:0 4px 20px rgba(0,102,204,0.15)}
.day-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.day-label{font-size:13px;font-weight:700;color:var(--color-primary)}
.day-dist{font-size:12px;color:var(--text-secondary);background:var(--bg-primary);padding:2px 8px;border-radius:8px}
.day-route{font-size:15px;font-weight:600;color:var(--text-primary);margin-bottom:4px;line-height:1.4}
.day-note{font-size:13px;color:var(--text-secondary);line-height:1.5}
.footer{text-align:center;padding:40px 16px;color:var(--text-secondary);font-size:13px;line-height:1.8}
.footer a{color:var(--color-primary);text-decoration:none}
@media(max-width:768px){
.nav{height:50px;padding:0 10px}
.nav-brand{font-size:14px;margin-right:8px}
.nav-btn{padding:5px 11px;font-size:12px}
#map{height:45vh;margin-top:50px}
.route-title{font-size:22px}
.route-header{padding:20px}
.info-grid{grid-template-columns:1fr 1fr}
.day-marker{width:48px}
.day-num{width:34px;height:34px;font-size:11px}
.content{padding:16px 12px 60px}
}
@media(max-width:480px){
.info-grid{grid-template-columns:1fr}
}
.fade-in{animation:fadeIn .4s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

let map,currentRoute=null,infoWindow=null,markers=[],polyline=null;
function initMap(){
map=new AMap.Map("map",{zoom:5,center:[91,30.5],viewMode:"2D",resizeEnable:true});
infoWindow=new AMap.InfoWindow({offset:new AMap.Pixel(0,-30),closeWhenClickMap:true});
}
function buildNav(){
const ns=document.getElementById("navScroll");
let html='<span class="category-label">境内</span>';
ROUTES.filter(r=>r.cat==="domestic").forEach(r=>{html+=`<button class="nav-btn" data-id="${r.id}" onclick="switchRoute('${r.id}')">${r.name}</button>`;});
html+='<div class="category-divider"></div><span class="category-label">进藏</span>';
ROUTES.filter(r=>r.cat==="overland").forEach(r=>{html+=`<button class="nav-btn" data-id="${r.id}" onclick="switchRoute('${r.id}')">${r.name}</button>`;});
ns.innerHTML=html;
}
function switchRoute(id){
const r=ROUTES.find(x=>x.id===id);if(!r)return;
currentRoute=r;
document.querySelectorAll(".nav-btn").forEach(b=>{b.classList.toggle("active",b.dataset.id===id);});
const ab=document.querySelector(`.nav-btn[data-id="${id}"]`);
if(ab)ab.scrollIntoView({behavior:"smooth",inline:"center",block:"nearest"});
renderMap(r);
renderContent(r);
window.scrollTo({top:document.getElementById("map").offsetTop+document.getElementById("map").offsetHeight-56,behavior:"smooth"});
}
function renderMap(r){
markers.forEach(m=>map.remove(m));markers=[];
if(polyline){map.remove(polyline);polyline=null;}
const coords=[];
const seen={};
r.stops.forEach(s=>{
const key=s.n+s.d;
if(seen[key])return;seen[key]=1;
const pos=[s.lon,s.lat];coords.push(pos);
const marker=new AMap.Marker({position:pos,content:`<div style="width:14px;height:14px;border-radius:50%;background:${r.color};border:2.5px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,0.3);"></div>`,offset:new AMap.Pixel(-7,-7),extData:s});
marker.on("click",function(){
infoWindow.setContent(`<div style="padding:8px 12px"><div class="popup-title">${s.n}</div><div class="popup-day">${s.d}${s.desc?' · '+s.desc:''}</div></div>`);
infoWindow.open(map,pos);
});
map.add(marker);markers.push(marker);
});
if(coords.length>1){
polyline=new AMap.Polyline({path:coords,strokeColor:r.color,strokeWeight:4,strokeOpacity:0.75,lineJoin:"round",lineCap:"round"});
map.add(polyline);
}
map.setFitView(null,false,[60,60,60,60],9);
}
function renderContent(r){
const c=document.getElementById("content");
const catClass=r.cat==="domestic"?"tag-domestic":"tag-overland";
const catLabel=r.cat==="domestic"?"西藏境内经典":"进藏自驾线路";
let h=`<div class="route-header fade-in"><span class="route-tag ${catClass}">${catLabel}</span><h1 class="route-title">${r.name} <span style="color:var(--text-secondary);font-weight:400;font-size:20px">${r.sub}</span></h1><p class="route-desc">${r.warning}</p><div class="info-grid"><div class="info-item"><div class="info-icon cal">📅</div><div><div class="info-label">建议天数</div><div class="info-value">${r.days}天</div></div></div><div class="info-item"><div class="info-icon car">🚗</div><div><div class="info-label">交通方式</div><div class="info-value">${r.transport}</div></div></div><div class="info-item"><div class="info-icon star">⭐</div><div><div class="info-label">适合人群</div><div class="info-value">${r.crowd}</div></div></div><div class="info-item"><div class="info-icon warn">⚠️</div><div><div class="info-label">注意事项</div><div class="info-value" style="font-weight:400;font-size:13px">${r.warning}</div></div></div></div></div>`;
h+='<div class="timeline fade-in"><div class="timeline-title">📋 每日行程</div>';
r.schedule.forEach((s,i)=>{
h+=`<div class="day-card"><div class="day-marker"><div class="day-num" style="background:${r.color}">${s.d}</div><div class="day-line" style="background:${r.color}"></div></div><div class="day-card-body" onclick="highlightStop(this,${i})" data-idx="${i}"><div class="day-head"><span class="day-label">${s.d}</span>${s.dist?`<span class="day-dist">${s.dist}</span>`:''}</div><div class="day-route">${s.route}</div><div class="day-note">${s.note}</div></div></div>`;
});
h+='</div>';
c.innerHTML=h;
}
function highlightStop(el,idx){
document.querySelectorAll(".day-card-body").forEach(c=>c.classList.remove("highlighted"));
el.classList.add("highlighted");
const r=currentRoute;if(!r)return;
let si=0;const seen2={};
for(let i=0;i<r.stops.length;i++){
const s=r.stops[i];const key=s.n+s.d;
if(seen2[key])continue;seen2[key]=1;
if(si===idx){map.setCenter([s.lon,s.lat]);map.setZoom(Math.max(map.getZoom(),9));break;}
si++;
}
}
initMap();buildNav();
switchRoute("r1");
</script>
